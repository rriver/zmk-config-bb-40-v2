draw_config:
  dark_mode: false
  svg_extra_style: |
    svg.keymap {
      background-color: #dddddd;
      font-family: Inter, sans-serif;
      fill: #24292e;
    }

    rect.key {
      fill: #ffffff;
    }

    rect.key,
    rect.combo {
      stroke: #c9cccf;
      stroke-width: 1;
    }

parse_config:
  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: '='
    PLUS: +
    MINUS: '-'
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH: \
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON: ;
    SEMI: ;
    COLON: ':'
    SINGLE_QUOTE: ''''
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ','
    LESS_THAN: <
    LT: <
    PERIOD: .
    DOT: .
    GREATER_THAN: '>'
    GT: '>'
    LEFT_BRACKET: '['
    LBKT: '['
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACKET: ']'
    RBKT: ']'
    RIGHT_BRACE: '}'
    RBRC: '}'
    GRAVE: '`'
    TILDE: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'
    LEFT_CONTROL: ⌃
    RIGHT_CONTROL: ⌃
    LEFT_SHIFT: ⇧
    RIGHT_SHIFT: ⇧
    LEFT_ALT: ⌥
    RIGHT_ALT: ⌥
    LEFT_GUI: ⌘
    RIGHT_GUI: ⌘
    LEFT_WIN: ⌘
    RIGHT_WIN: ⌘
    GLOBE: $$fa:solid/globe$$
    ENTER: ⏎
    RETURN: ⏎
    C_PLAY_PAUSE: $$fa:solid/circle-play$$
    C_PREVIOUS: $$fa:solid/backward-step$$
    C_NEXT: $$fa:solid/forward-step$$
    C_VOLUME_DOWN: $$fa:solid/volume-low$$
    C_VOLUME_UP: $$fa:solid/volume-high$$
    BACKSPACE: ⌫
    ESCAPE: ⎋
    ESC: ⎋
    TAB: ⇥
    CAPSLOCK: ⇪
    CAPS_LOCK: ⇪
    DELETE: $$fa:solid/trash-can$$
    LEFT: ←
    LEFT_ARROW: ←
    RIGHT: →
    RIGHT_ARROW: →
    UP: ↑
    UP_ARROW: ↑
    DOWN: ↓
    DOWN_ARROW: ↓

  modifier_fn_map:
    left_ctrl: ⌃
    right_ctrl: ⌃
    left_shift: ⇧
    right_shift: ⇧
    left_alt: ⌥
    right_alt: ⌥
    left_gui: ⌘
    right_gui: ⌘

    keycode_combiner: '{mods}{key}'
    mod_combiner: '{mod_1}{mod_2}'

    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: ✦
      left_ctrl+left_alt+left_shift: Meh
