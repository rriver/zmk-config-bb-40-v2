draw_config:
  dark_mode: false
  glyph_tap_size: 14
  outer_pad_h: 100

  glyphs:
    language-latin: |
      <svg viewBox="0 0 44 34" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 1H35A8 8 0 0 1 43 9V25A8 8 0 0 1 35 33H9A8 8 0 0 1 1 25V9A8 8 0 0 1 9 1Z" style="fill:#000000"/>
        <text x="22" y="17" text-anchor="middle" dominant-baseline="central" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ffffff">A</text>
      </svg>
    language-japanese: |
      <svg viewBox="0 0 44 34" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 1H35A8 8 0 0 1 43 9V25A8 8 0 0 1 35 33H9A8 8 0 0 1 1 25V9A8 8 0 0 1 9 1Z" style="fill:#000000"/>
        <text x="22" y="17" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="21" font-weight="600" fill="#ffffff">あ</text>
      </svg>

  svg_extra_style: |
    svg.keymap {
      background-color: #1f2428;
      font-family: Inter, sans-serif;
      fill: #24292e;
    }

    rect.key {
      fill: #ededed;
    }

    rect.combo,
    rect.combo-separate,
    rect.combo.held {
      fill: #ffffff;
    }

    rect.key,
    rect.combo {
      stroke: #c9cccf;
      stroke-width: 1;
    }

    text.label {
      font-size: 20px;
      fill: #ffffff;
      font-weight: 700;
      stroke: none;
      transform: translateY(20px);
    }

parse_config:
  raw_binding_map:
    "&bootloader": "$$fa:solid/gear$$"
    "&mouse_gesture": "$$fa:solid/computer-mouse$$"
    "&to_layer_0 LANGUAGE_1": "$$language-latin$$"
    "&to_layer_0 LANGUAGE_2": "$$language-japanese$$"
    "&mkp MB1": "MB1"
    "&mkp MB2": "MB2"
    "&mkp MB3": "MB3"
    "&mkp MB4": "MB4"
    "&mkp MB5": "MB5"

  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: '='
    PLUS: +
    MINUS: '-'
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH: \
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON: ;
    SEMI: ;
    COLON: ':'
    SINGLE_QUOTE: ''''
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ','
    LESS_THAN: <
    LT: <
    PERIOD: .
    DOT: .
    GREATER_THAN: '>'
    GT: '>'
    LANGUAGE_1: $$language-latin$$
    LANGUAGE_2: $$language-japanese$$
    LEFT_BRACKET: '['
    LBKT: '['
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACKET: ']'
    RBKT: ']'
    RIGHT_BRACE: '}'
    RBRC: '}'
    GRAVE: '`'
    TILDE: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'
    LEFT_CONTROL: ⌃
    RIGHT_CONTROL: ⌃
    LEFT_SHIFT: ⇧
    RIGHT_SHIFT: ⇧
    LEFT_ALT: ⌥
    RIGHT_ALT: ⌥
    LEFT_GUI: ⌘
    RIGHT_GUI: ⌘
    LEFT_WIN: ⌘
    RIGHT_WIN: ⌘
    GLOBE: $$fa:solid/globe$$
    ENTER: ⏎
    RETURN: ⏎
    C_PLAY_PAUSE: $$fa:solid/play$$
    C_PREVIOUS: $$fa:solid/backward-step$$
    C_NEXT: $$fa:solid/forward-step$$
    C_VOLUME_DOWN: $$fa:solid/volume-low$$
    C_VOLUME_UP: $$fa:solid/volume-high$$
    BACKSPACE: ⌫
    ESCAPE: ESC
    ESC: ESC
    TAB: ⇥
    CAPSLOCK: ⇪
    CAPS_LOCK: ⇪
    DELETE: ⌦
    DEL: ⌦
    LEFT: ←
    LEFT_ARROW: ←
    RIGHT: →
    RIGHT_ARROW: →
    UP: ↑
    UP_ARROW: ↑
    DOWN: ↓
    DOWN_ARROW: ↓
    SPACE: "␣"

  modifier_fn_map:
    left_ctrl: ⌃
    right_ctrl: ⌃
    left_shift: ⇧
    right_shift: ⇧
    left_alt: ⌥
    right_alt: ⌥
    left_gui: ⌘
    right_gui: ⌘

    keycode_combiner: '{mods}{key}'
    mod_combiner: '{mod_1}{mod_2}'

    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: ✦
      left_ctrl+left_alt+left_shift: Meh
